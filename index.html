<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streamer Broadcast Guide | Live Alert Center</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #05070a;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* HEADER BLOCK */
    .header-card {
      background: linear-gradient(145deg, rgba(11, 16, 30, 0.9), rgba(5, 7, 10, 0.95));
      border: 1px solid rgba(30, 41, 59, 0.8);
      border-radius: 20px;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .header-card h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #3b82f6;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    .header-card p {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    /* CONTROLS & ADD STREAMER FORM */
    .control-panel {
      background: #0b101e;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }

    .input-group {
      display: flex;
      flex: 1;
      gap: 0.5rem;
      min-width: 280px;
    }

    .input-group input {
      flex: 1;
      background: #05070a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .input-group input:focus {
      border-color: #3b82f6;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: #10b981;
      color: #fff;
    }

    .btn-primary:hover {
      background: #059669;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }

    .btn-secondary:hover {
      background: #334155;
      color: #fff;
    }

    /* STATUS SYNC BAR */
    .sync-status {
      font-size: 0.8rem;
      color: #64748b;
      text-align: right;
      padding-right: 0.5rem;
    }

    /* STREAMER GRID DISPLAY */
    .streamer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .streamer-card {
      background: rgba(11, 16, 30, 0.8);
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .streamer-card:hover {
      border-color: #3b82f6;
      transform: translateY(-2px);
    }

    .streamer-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .streamer-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .platform-tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748b;
      font-weight: 600;
      margin-top: 0.25rem;
    }

    .status-badge {
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .status-badge.live {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid #ef4444;
      animation: pulseGlow 2s infinite;
    }

    .status-badge.offline {
      background: rgba(100, 116, 139, 0.2);
      color: #64748b;
      border: 1px solid #334155;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 5px rgba(239, 68, 68, 0.4); }
      50% { box-shadow: 0 0 15px rgba(239, 68, 68, 0.8); }
    }

    .card-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1.5rem;
    }

    .btn-watch {
      flex: 1;
      text-decoration: none;
      text-align: center;
      background: #3b82f6;
      color: #fff;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .btn-watch:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <div class="header-card">
      <h1>📡 Broadcast Guide & Live Center</h1>
      <p>Real-time channel tracker synced directly with your Google Sheet backend.</p>
    </div>

    <!-- ADD STREAMER CONTROL PANEL -->
    <div class="control-panel">
      <div class="input-group">
        <input type="url" id="streamerUrlInput" placeholder="Paste Creator Profile Link (e.g., https://www.tiktok.com/@username)">
      </div>
      <button class="btn btn-primary" onclick="addNewStreamerToSheet()">+ Sync & Add Streamer</button>
      <button class="btn btn-secondary" onclick="requestNotificationPermission()">🔔 Enable Alerts</button>
    </div>
    
    <div class="sync-status" id="syncStatus">Connecting to Google Sheet...</div>

    <!-- STREAMERS GRID -->
    <div class="streamer-grid" id="streamerGrid">
      <div style="color: #64748b; text-align: center; grid-column: 1 / -1; padding: 2rem;">Loading streamers from cloud sheet...</div>
    </div>

  </div>

  <script>
    // REPLACE WITH YOUR PUBLISHED APPS SCRIPT WEB APP URL (/exec)
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwVBi6RYyI4drSl-VDI5_gL7DXIclsrTnYkcp3pZv9jNB6_50I3xdjQlvWWRveAJaxnkA/exec";

    let streamers = [];

    // 1. FETCH STREAMERS FROM GOOGLE SHEET VIA WEB APP doGet
    async function fetchStreamersFromCloud() {
      if (!WEB_APP_URL || WEB_APP_URL.includes("YOUR_APPS_SCRIPT")) {
        document.getElementById('syncStatus').innerText = "⚠️ Please set your Web App URL in the HTML code.";
        return;
      }

      try {
        const response = await fetch(WEB_APP_URL);
        const data = await response.json();

        if (data.status === "success" && data.streamers) {
          streamers = data.streamers;
          renderGrid();
          document.getElementById('syncStatus').innerText = "🟢 Synced live with Google Sheet (" + new Date().toLocaleTimeString() + ")";
        }
      } catch (err) {
        console.error("Error fetching sheet data:", err);
        document.getElementById('syncStatus').innerText = "🔴 Error connecting to Google Sheet backend.";
      }
    }

    // 2. RENDER STREAMER CARDS
    function renderGrid() {
      const grid = document.getElementById('streamerGrid');
      grid.innerHTML = '';

      if (streamers.length === 0) {
        grid.innerHTML = '<div style="color: #64748b; text-align: center; grid-column: 1 / -1; padding: 2rem;">No streamers found in your guide. Add one above!</div>';
        return;
      }

      streamers.forEach(s => {
        const isLive = s.status === "LIVE";
        const card = document.createElement('div');
        card.className = 'streamer-card';
        card.innerHTML = `
          <div>
            <div class="streamer-header">
              <div>
                <div class="streamer-name">${s.name}</div>
                <div class="platform-tag">${s.platform}</div>
              </div>
              <span class="status-badge ${isLive ? 'live' : 'offline'}">
                ${isLive ? '● LIVE' : 'OFFLINE'}
              </span>
            </div>
          </div>
          <div class="card-actions">
            <a href="${s.url}" target="_blank" class="btn-watch">
              ${isLive ? '▶ Watch Live Stream' : 'View Channel'}
            </a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // 3. ADD STREAMER VIA WEB APP doPost (Sends to Streamer_Intake)
    async function addNewStreamerToSheet() {
      const urlInput = document.getElementById('streamerUrlInput');
      const rawUrl = urlInput.value.trim();

      if (!rawUrl) {
        alert("Please paste a valid creator profile URL.");
        return;
      }

      document.getElementById('syncStatus').innerText = "⏳ Adding streamer to cloud sheet...";

      try {
        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify({ url: rawUrl }),
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          }
        });

        const result = await response.json();
        if (result.status === "success") {
          urlInput.value = '';
          alert("Streamer successfully added and formatted in your sheet!");
          fetchStreamersFromCloud(); // Refresh grid
        } else {
          alert("Error adding streamer: " + result.message);
        }
      } catch (err) {
        alert("Network error while adding streamer.");
        console.error(err);
      }
    }

    // 4. DESKTOP NOTIFICATIONS FOR LIVE CHANNELS
    function requestNotificationPermission() {
      if ("Notification" in window) {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            new Notification("Alerts Activated!", {
              body: "You will receive desktop alerts when monitored creators go live."
            });
          }
        });
      }
    }

    // Poll Google Sheet for live updates every 30 seconds
    fetchStreamersFromCloud();
    setInterval(fetchStreamersFromCloud, 30000);
  </script>
</body>
</html>
